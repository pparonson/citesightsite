<!DOCTYPE html>
<html lang="en" data-theme="lofi">
    <head>
        <meta charset="UTF-8" />
        <!-- <link rel="icon" href="/favicon.ico" /> -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PenItIn</title>
        <!-- Add window.nostr.js for NIP-46 support -->
        <script src="https://cdn.jsdelivr.net/npm/window.nostr.js/dist/window.nostr.min.js"></script>
        <!-- Configure window.nostr.js -->
        <script>
            window.wnParams = {
                position: 'bottom',
                accent: 'green',
                startHidden: false,  // Make it visible by default
                compactMode: false   // Use full mode for better visibility
            }
            
            // Check if window.nostr.js is loaded correctly
            window.addEventListener('DOMContentLoaded', () => {
                console.log('Checking window.nostr availability:', window.nostr ? 'Available' : 'Not available');
                if (!window.nostr) {
                    console.warn('window.nostr is not available. Attempting to initialize manually...');
                    // Try to initialize manually if needed
                }
            });
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
